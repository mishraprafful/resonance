[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resonance-workers"
version = "0.0.1"
description = "Resonance audio derivation workers (transcode, waveform peaks, spectrogram)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "soundfile>=0.12",
    "pillow>=10",
    "boto3>=1.34",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.15.16"]

[tool.hatch.build.targets.wheel]
packages = ["src/resonance_workers"]

[tool.ruff]
line-length = 100
