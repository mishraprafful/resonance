[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resonance-api"
version = "0.0.1"
description = "Resonance control + query plane (FastAPI)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
    "boto3>=1.34",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff==0.15.16"]

[tool.hatch.build.targets.wheel]
packages = ["src/resonance_api"]

[tool.ruff]
line-length = 100
