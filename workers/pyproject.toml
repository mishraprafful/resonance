[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resonance-workers"
version = "0.0.1"
description = "Resonance audio derivation workers (transcode, waveform peaks, spectrogram)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
audio = ["librosa>=0.10", "soundfile>=0.12", "pillow>=10"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/resonance_workers"]

[tool.ruff]
line-length = 100
