name: e2e

# End-to-end gate: boots the full docker stack + all backend services and runs the E2E suite
# against the live system. A green run here is the authoritative "the whole product works" signal.
# Make this a REQUIRED status check in branch protection on `main` (see tests/e2e/README.md).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System deps (libsndfile for soundfile, ffmpeg for audio probes)
        run: sudo apt-get update && sudo apt-get install -y libsndfile1 ffmpeg

      - name: Run the end-to-end suite
        run: make e2e

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "===== docker stack logs ====="
          cat .run/docker-stack.log 2>/dev/null || echo "(no docker-stack.log)"
          echo "===== app service logs ====="
          tail -n +1 .run/ingest.log .run/media.log .run/api.log .run/worker.log 2>/dev/null || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: .run/*.log
          if-no-files-found: ignore
