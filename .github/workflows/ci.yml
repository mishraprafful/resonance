name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: python (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [sdk, services/api, workers]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: ${{ matrix.component }}
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: ${{ matrix.component }}
        run: ruff check .
      - name: Test
        working-directory: ${{ matrix.component }}
        run: pytest -q

  go:
    name: go (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [services/ingest, services/media]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Vet
        working-directory: ${{ matrix.component }}
        run: go vet ./...
      - name: Test
        working-directory: ${{ matrix.component }}
        run: go test ./...

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: web
        run: npm install
      - name: Typecheck
        working-directory: web
        run: npm run lint
