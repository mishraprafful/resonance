# Resonance local development stack.
# Usage: `make dev-up` (from repo root) or `docker compose -f deploy/dev/docker-compose.yml up -d`.
name: resonance-dev

services:
  # --- Metadata plane ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resonance
      POSTGRES_USER: resonance
      POSTGRES_PASSWORD: resonance
    ports:
      - "5432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resonance"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Metrics plane (sharded ClickHouse cluster) ---
  # Coordination for ReplicatedMergeTree + ON CLUSTER DDL (the ZooKeeper replacement).
  clickhouse-keeper:
    image: clickhouse/clickhouse-server:24.8-alpine
    entrypoint: ["/usr/bin/clickhouse", "keeper", "--config-file=/etc/clickhouse-keeper/keeper_config.xml"]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - ./.data/clickhouse-keeper:/var/lib/clickhouse
      - ./clickhouse/keeper/keeper_config.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9182/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Shard 1.
  clickhouse-01:
    image: clickhouse/clickhouse-server:24.8-alpine
    depends_on:
      clickhouse-keeper:
        condition: service_started
    environment:
      CLICKHOUSE_DB: resonance
      CLICKHOUSE_USER: resonance
      CLICKHOUSE_PASSWORD: resonance
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"   # HTTP  (control API + ingest target this node; Distributed routes to shards)
      - "9000:9000"   # native
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - ./.data/clickhouse-01:/var/lib/clickhouse
      - ./clickhouse/config.d/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./clickhouse/config.d/macros-01.xml:/etc/clickhouse-server/config.d/macros.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Shard 2.
  clickhouse-02:
    image: clickhouse/clickhouse-server:24.8-alpine
    depends_on:
      clickhouse-keeper:
        condition: service_started
    environment:
      CLICKHOUSE_DB: resonance
      CLICKHOUSE_USER: resonance
      CLICKHOUSE_PASSWORD: resonance
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8124:8123"   # HTTP  (exposed for verifying shard distribution directly)
      - "9002:9000"   # native
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - ./.data/clickhouse-02:/var/lib/clickhouse
      - ./clickhouse/config.d/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./clickhouse/config.d/macros-02.xml:/etc/clickhouse-server/config.d/macros.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: create the database + _local (Replicated) and Distributed tables ON CLUSTER once both
  # nodes + Keeper are reachable. Retries the DDL until the cluster is ready (initdb can't run it
  # because ON CLUSTER needs every node up).
  clickhouse-init:
    image: clickhouse/clickhouse-server:24.8-alpine
    depends_on:
      clickhouse-01:
        condition: service_healthy
      clickhouse-02:
        condition: service_healthy
    volumes:
      - ./clickhouse/init.sql:/init.sql:ro
    entrypoint: >
      /bin/sh -c "
      echo 'waiting for clickhouse nodes...';
      until clickhouse-client --host clickhouse-01 --user resonance --password resonance --query 'SELECT 1' >/dev/null 2>&1; do sleep 2; done;
      until clickhouse-client --host clickhouse-02 --user resonance --password resonance --query 'SELECT 1' >/dev/null 2>&1; do sleep 2; done;
      echo 'applying cluster DDL...';
      until clickhouse-client --host clickhouse-01 --user resonance --password resonance --multiquery < /init.sql; do echo 'cluster not ready, retrying DDL'; sleep 2; done;
      echo 'clickhouse cluster schema ready';
      "

  # --- Audio/blob plane ---
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: resonance
      MINIO_ROOT_PASSWORD: resonance-secret
    ports:
      - "9100:9000"   # S3 API (host 9100 to avoid clash with ClickHouse native 9000)
      - "9001:9001"   # console
    volumes:
      - ./.data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Create the default bucket on startup.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 resonance resonance-secret &&
      mc mb --ignore-existing local/resonance-blobs &&
      echo 'bucket ready';
      "

  # --- Stream queue ---
  redpanda:
    image: redpandadata/redpanda:latest
    # Run as root so Redpanda can create its data subdirs in the bind-mounted ./.data/redpanda. Its
    # image runs as the non-root `redpanda` user and does NOT chown the mount (unlike the Postgres/
    # ClickHouse/MinIO entrypoints), so on native Linux (CI) it hits `mkdir: Permission denied` on a
    # root-owned bind mount and exits 1. (Docker Desktop on macOS masks this — bind-mount ownership
    # is ignored there — which is why it only failed in CI.)
    user: root
    command:
      # `--mode dev-container` is Redpanda's purpose-built profile for resource-constrained
      # containers: it implies --overprovisioned, sets a small reserve, and bounds memory to a
      # container-appropriate share instead of grabbing most of host RAM. Unbounded (the default
      # mode), seastar reserves ~7.6GiB and runs abort_on_allocation_failure=true, so on a full-stack
      # `up` (2 ClickHouse nodes + Keeper + MinIO + Postgres contending — e.g. a 7GiB CI runner) it
      # loses the memory race and aborts (exit 1), failing `make e2e` non-deterministically. The cap
      # keeps the single tiny derivation topic well within budget.
      - redpanda start
      - --mode dev-container
      - --smp 1
      - --memory 1G
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"   # admin API (consumer-group lag for autoscaling lives here)
      - "8082:8082"   # HTTP proxy (pandaproxy) — derivation produce/consume over REST
    volumes:
      - ./.data/redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Pre-create the derivation topic. pandaproxy produce does NOT auto-create topics, so the explicit
  # create is required for the fast lane to work. `rpk topic create` only honors the local broker in
  # this image (the -X brokers/RPK_BROKERS override is ignored for create), so we share redpanda's
  # network namespace to make localhost:9092 the broker.
  redpanda-init:
    image: redpandadata/redpanda:latest
    depends_on:
      redpanda:
        condition: service_healthy
    network_mode: "service:redpanda"
    entrypoint: >
      /bin/sh -c "
      rpk topic create audio.derivations -p 1 -r 1 || true;
      echo 'derivation topic ready';
      "

  # --- Cache ---
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./.data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
